# ── prefix ──────────────────────────────────────────────────────────────────
# C-a: same finger position as C-b but on the home row, and it no longer
# shadows vim's page-up. The select-all mapping that used to occupy C-a in my
# neovim config is gone, so nothing competes for it now.
#
# tmux swallows the key, so neovim never sees a bare C-a (vim's "increment
# number under cursor"). send-prefix gets it back: C-a C-a sends a literal one.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── neovim interop ──────────────────────────────────────────────────────────
# Without this, every <Esc> in neovim waits for tmux to decide whether the byte
# starts an escape sequence. I save with <Esc>, so the lag would be constant.
set -sg escape-time 10
# Lets neovim's autoread and gitsigns notice changes when I switch panes.
set -g focus-events on

# True colour plus undercurls, both of which wezterm supports. Diagnostics in
# neovim render as flat underlines without the Smulx/Setulc entries.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m"

# ── panes: C-hjkl, transparently shared with neovim ─────────────────────────
# The problem this solves: C-h in a neovim pane should move between neovim's
# splits, but at the edge of the last split it should cross into the next tmux
# pane. So tmux only steals the key when the pane is not running vim. The
# neovim half is christoomey/vim-tmux-navigator, declared in
# ../nvim/lua/plugins/tmux.lua.
#
# The widely copied version of this shells out to `ps ... | grep -E` on every
# single press. That works, but it forks two processes per keystroke and its
# regex quietly depends on which grep is first on PATH. tmux already tracks the
# foreground process itself, so -F with a format match does the same job with
# no shell at all.
is_vim="#{m/ri:^(g?(view|l?n?vim?x?)|fzf)(diff)?$,#{pane_current_command}}"
bind -n C-h if-shell -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F "$is_vim" "send-keys C-l" "select-pane -R"
# In copy mode there is no vim to defer to, so move directly.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Prefix + hjkl also works, for when a pane is running something that wants
# the bare C-hjkl keys for itself.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with the shifted versions, repeatable so it can be held down.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z          # zoom the current pane

# ── splits ──────────────────────────────────────────────────────────────────
# Default keys: % splits side by side, " splits stacked. Only change is -c, so
# a new pane or window opens in the directory I was already in instead of $HOME.
# Drop the -c parts if you want stock behaviour.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── windows ─────────────────────────────────────────────────────────────────
set -g base-index 1               # 0 is a long reach on the number row
setw -g pane-base-index 1
set -g renumber-windows on        # no gaps after closing a window
setw -g automatic-rename on
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ── copy mode ───────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# OSC 52, so yanking still reaches the local clipboard over ssh.
set -g set-clipboard on

# ── misc ────────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── theme: rose-pine moon, to match wezterm ─────────────────────────────────
# bg=default everywhere is deliberate: wezterm runs at 0.8 opacity with blur,
# and any solid colour here would punch an opaque bar through it.
set -g status-style "bg=default,fg=#908caa"
set -g status-position bottom
set -g status-justify left
set -g status-left  "#[fg=#c4a7e7,bold] #S "
set -g status-right "#{?client_prefix,#[fg=#eb6f92]● ,}#[fg=#6e6a86]%H:%M "
set -g status-left-length 40
set -g status-right-length 40
setw -g window-status-format         "#[fg=#6e6a86] #I #W "
setw -g window-status-current-format "#[fg=#f6c177,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#3e8fb0"
set -g message-style "bg=#2a273f,fg=#e0def4"
set -g mode-style "bg=#393552,fg=#e0def4"
